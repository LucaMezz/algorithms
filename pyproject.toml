[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "algorithms-from-scratch"
version = "0.0.0"
description = "Readable algorithm and data structure implementations built from scratch."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = [
  "algorithms",
  "data-structures",
  "computer-science",
  "education",
  "python",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pre-commit>=4.0",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]
bench = [
  "matplotlib>=3.9",
  "pytest-benchmark>=4.0",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
]

[project.urls]
Homepage = "https://github.com/LucaMezz/algorithms"
Repository = "https://github.com/LucaMezz/algorithms"
Issues = "https://github.com/LucaMezz/algorithms/issues"
Changelog = "https://github.com/LucaMezz/algorithms/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/algorithms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=algorithms",
  "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true
source = ["algorithms"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "\\.\\.\\.",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests", "examples", "benchmarks"]

[tool.ruff.lint]
select = [
  "A",    # flake8-builtins
  "ANN",  # flake8-annotations
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "D",    # pydocstyle
  "E",    # pycodestyle errors
  "F",    # Pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "PL",   # Pylint
  "PT",   # flake8-pytest-style
  "RET",  # flake8-return
  "RUF",  # Ruff-specific rules
  "SIM",  # flake8-simplify
  "UP",   # pyupgrade
  "W",    # pycodestyle warnings
]
ignore = [
  "D100",  # module-level docstrings not required on re-export __init__.py files
  "D104",  # package-level docstrings not required on __init__.py files
  "D105",  # magic method docstrings not required (signature is self-documenting)
  "D107",  # __init__ docstring not required (class docstring covers construction)
  "E501",  # line length handled by formatter
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "ANN",     # tests do not need full annotation strictness
  "D",       # tests do not need docstrings
  "PLR2004", # magic values are often fine in tests
]
"examples/**/*.py" = [
  "T201", # examples may print output if T20 is enabled later
]
"benchmarks/**/*.py" = [
  "D",    # benchmark scripts do not need docstrings
  "T201", # benchmark CLI reports generated files to stdout
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["algorithms"]
strict = true
warn_unused_configs = true
warn_unreachable = true
pretty = true

